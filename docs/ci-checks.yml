name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  app-and-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install development-only syntax parser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test state recovery and ES5 syntax
        run: npm test
      - name: Build the native preview
        run: python3 build.py
      - name: Test HTTP ranges, file isolation and sync package
        run: python3 -m unittest discover -s tests -v
