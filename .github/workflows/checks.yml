name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
jobs:
  app-and-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=high
      - name: Test state recovery, native bridge and ES5 syntax
        run: npm test
      - name: Build all three release packages
        run: python build.py
      - name: Test package reproducibility, HTTP and device boundaries
        run: python -m unittest discover -s tests -v
      - name: Check committed release metadata
        run: git diff --exit-code -- app/version.js release.json SHA256SUMS
      - name: Install Chrome for actual H.264/AAC playback tests
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chrome
      - name: Exercise the browser UI and complete demo playback
        if: runner.os == 'Linux'
        run: npm run test:browser
